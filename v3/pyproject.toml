[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "codetruth-agent-v3-module1"
version = "1.0.0"
description = "CodeTruth Agent V3 — Module 1: Repository Cognition Engine (deterministic repository discovery and classification)"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
authors = [
    { name = "Zeeshan Saud" }
]
requires-python = ">=3.10"
dependencies = []

[project.urls]
Homepage = "https://github.com/Zeeshan78699/CodeTruthAgent"

[tool.setuptools.packages.find]
where = ["."]
include = ["repository_cognition*"]
